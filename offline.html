<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06193A">
<meta name="robots" content="noindex">
<title>بحر | لا يوجد اتصال</title>
<style>
:root{--nav:#06193A;--gold:#C9A24B;--cloud:#EDF1F5;--mut:#5B6879;--f:"Readex Pro","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f);background:var(--nav);color:#fff;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
main{max-width:420px;text-align:center}
.mk{font-size:44px;font-weight:700;letter-spacing:.5px;margin:0 0 6px}
.bar{width:56px;height:3px;background:var(--gold);border-radius:3px;margin:0 auto 22px}
h1{font-size:22px;margin:0 0 10px}
p{margin:0 0 22px;line-height:1.9;color:#D7DEE8}
button{font:inherit;font-weight:600;font-size:16px;min-height:46px;padding:0 28px;border:0;border-radius:10px;background:var(--gold);color:var(--nav);cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main role="main">
  <p class="mk" aria-hidden="true">بحر</p>
  <div class="bar" aria-hidden="true"></div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تعذّر الوصول إلى بحر الآن. تأكد من اتصالك بالإنترنت ثم أعد المحاولة.</p>
  <button type="button" id="r">إعادة المحاولة</button>
</main>
<script>
document.getElementById('r').addEventListener('click',function(){location.reload()});
window.addEventListener('online',function(){location.reload()});
</script>
</body>
</html>
